<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Preview Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body class="p-10">

    <div class="flex-shrink-0">
        <label class="block text-sm font-medium text-slate-700 mb-2">Image</label>
        <label class="w-32 h-32 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center text-slate-400 hover:border-primary hover:text-primary transition-all cursor-pointer group relative overflow-hidden">
            <img id="imagePreview" class="absolute inset-0 w-full h-full object-cover hidden z-10">
            <div id="uploadPlaceholder" class="flex flex-col items-center justify-center text-center p-2">
                <span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform">add_photo_alternate</span>
                <span class="text-[8px] font-bold uppercase tracking-wider">Upload</span>
            </div>
            <div id="changeImageOverlay" class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity hidden z-20">
                <span class="text-white text-[10px] font-bold uppercase border border-white px-2 py-0.5 rounded-full">Change</span>
            </div>
            <input type="file" name="product_image" id="productImageInput" class="hidden" accept="image/*" required onchange="previewImage(this)">
        </label>
    </div>

    <script>
        function previewImage(input) {
            console.log("Preview image triggered");
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');
            const overlay = document.getElementById('changeImageOverlay');
    
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    console.log("File read successfully");
                    if (preview) {
                        preview.src = e.target.result;
                        preview.classList.remove('hidden');
                        preview.style.display = 'block'; // Force display
                    }
                    if (placeholder) {
                        placeholder.classList.add('hidden');
                        placeholder.style.display = 'none'; // Force hide
                    }
                    if (overlay) {
                        overlay.classList.remove('hidden');
                        overlay.style.display = 'flex'; // Force display flex
                    }
                }
                
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
